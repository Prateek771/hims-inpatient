name: Checks

on:
  push:
    branches: [main, codex/hims-development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: hims-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create isolated synthetic databases
        run: node scripts/bootstrap-local-database.mjs
        env:
          HIMS_SETUP_ADMIN_PASSWORD: hims-ci-only
      - name: Apply HIMS migrations
        run: npm run db:migrate
      - name: Verify fresh local staff setup
        run: npm run auth:bootstrap -- --demo
        env:
          HIMS_DEMO_PASSWORD: SyntheticCISetupOnly123!
      - name: Unit checks
        run: npm run test:unit
      - name: PostgreSQL integration checks
        run: npm run test:integration
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Save failure report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-failure
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
