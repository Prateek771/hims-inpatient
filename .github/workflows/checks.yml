name: Checks

on:
  push:
    branches: [main, codex/hims-development, codex/mariadb-port]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # MariaDB 11.8 matches the Hostinger database service. Pin by digest when the image is next reviewed.
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: hims-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/playwright-browsers
      # Throwaway CI-only credentials for the synthetic service container above.
      DATABASE_URL: mysql://hims_app:hims-ci-app@127.0.0.1:3306/hims_local
      MIGRATION_DATABASE_URL: mysql://hims_app:hims-ci-app@127.0.0.1:3306/hims_local
      TEST_DATABASE_URL: mysql://hims_test_owner:hims-ci-owner@127.0.0.1:3306/hims_test
      TEST_RUNTIME_DATABASE_URL: mysql://hims_test_runtime:hims-ci-runtime@127.0.0.1:3306/hims_test
      BETTER_AUTH_SECRET: hims-ci-session-signing-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install MariaDB client and dump tools
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Create isolated synthetic databases
        run: |
          mariadb -h127.0.0.1 -uroot -phims-ci-only <<'SQL'
          CREATE DATABASE hims_local CHARACTER SET utf8mb4 COLLATE utf8mb4_nopad_bin;
          CREATE DATABASE hims_test CHARACTER SET utf8mb4 COLLATE utf8mb4_nopad_bin;
          CREATE USER 'hims_app'@'%' IDENTIFIED BY 'hims-ci-app';
          CREATE USER 'hims_test_owner'@'%' IDENTIFIED BY 'hims-ci-owner';
          CREATE USER 'hims_test_runtime'@'%' IDENTIFIED BY 'hims-ci-runtime';
          GRANT ALL ON hims_local.* TO 'hims_app'@'%';
          GRANT ALL ON hims_test.* TO 'hims_test_owner'@'%' WITH GRANT OPTION;
          GRANT ALL ON `hims\_test\_restore\_%`.* TO 'hims_test_owner'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, EXECUTE ON hims_test.* TO 'hims_test_runtime'@'%';
          GRANT PROCESS ON *.* TO 'hims_test_owner'@'%';
          GRANT PROCESS ON *.* TO 'hims_test_runtime'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Apply HIMS migrations
        run: npm run db:migrate
      - name: Verify fresh clone demo setup
        run: npm run demo:seed
      - name: Unit checks
        run: npm run test:unit
      - name: MariaDB integration checks
        run: npm run test:integration
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Isolated backup and restore verification
        run: npm run test:recovery
      - name: Save failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
